name: Update streak badge SVG

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh streak SVG from live API
        env:
          GIT_AUTHOR_NAME: Magne Dina Neves
          GIT_AUTHOR_EMAIL: magnedinanevesdina@gmail.com
          GIT_COMMITTER_NAME: Magne Dina Neves
          GIT_COMMITTER_EMAIL: magnedinanevesdina@gmail.com
        run: |
          set -euo pipefail
          STAMP=$(date -u +%s)
          curl -sL "https://github-readme-streak-stats-eight.vercel.app/?user=KRYPTON0078&theme=dark&hide_border=false&v=${STAMP}" -o docs/badges/streak.svg
          git config user.name "Magne Dina Neves"
          git config user.email "magnedinanevesdina@gmail.com"
          git add docs/badges/streak.svg
          if git diff --cached --quiet; then echo "No SVG change"; exit 0; fi
          git commit -m "Auto-refresh streak badge SVG (${STAMP})."
          git push origin main
